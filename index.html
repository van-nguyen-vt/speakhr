<title>SpeakHR – Luyện nói tiếng Anh cho HR</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14211f;--mute:#5d6b68;--line:#e2e7e5;--pri:#0f766e;--pri2:#115e59;--soft:#e6f4f1;--good:#16a34a;--mid:#d97706;--bad:#dc2626;--blue:#2563eb;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 110px)}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:20px;margin:6px 0 8px}h3{font-size:17px;margin:14px 0 6px}
p{margin:6px 0}.mute{color:var(--mute)}.small{font-size:13px}.center{text-align:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--soft);color:var(--pri2);font-weight:600;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.45}
.btn-pri{background:var(--pri);color:#fff}.btn-big{width:100%;padding:15px;font-size:17px}
.btn-ghost{background:transparent;color:var(--pri2);padding:8px 10px}.btn-danger{background:#fde8e8;color:var(--bad)}
.btn-sm{padding:7px 11px;font-size:14px;border-radius:10px}
.mic{width:72px;height:72px;border-radius:50%;background:var(--pri);color:#fff;font-size:30px;display:inline-flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 14px rgba(15,118,110,.35)}
.mic.rec{background:var(--bad);animation:pulse 1.2s infinite}.mic.sm{width:52px;height:52px;font-size:22px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 16px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
label{font-weight:600;font-size:14px;display:block;margin:12px 0 4px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--pri2);font-size:13px;font-weight:600}
.steps{display:flex;gap:4px;margin:8px 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--pri)}.steps i.done{background:#7cc4b8}
.en{font-size:19px;font-weight:600}.vi{color:var(--mute);font-size:15px}
.w{display:inline-block;padding:1px 3px;margin:1px;border-radius:6px;font-weight:600;cursor:pointer}
.w.g{color:var(--good)}.w.m{color:var(--mid);background:#fff6e5}.w.b{color:var(--bad);background:#fdecec}.w.o{color:#9ca3af;text-decoration:line-through}
.scores{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.sc{flex:1;min-width:70px;background:#f7faf9;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.sc b{display:block;font-size:20px}.sc span{font-size:12px;color:var(--mute)}
.c-g{color:var(--good)}.c-m{color:var(--mid)}.c-b{color:var(--bad)}
.bubble{padding:10px 13px;border-radius:16px;margin:8px 0;max-width:88%}
.ai{background:#fff;border:1px solid var(--line)}.me{background:var(--soft);margin-left:auto}
.fixbox{background:#fff6e5;border:1px solid #f6d79b;border-radius:12px;padding:9px 11px;margin:6px 0;font-size:15px}
.okbox{background:#eaf7ee;border:1px solid #b5e3c2;border-radius:12px;padding:9px 11px;margin:6px 0;font-size:15px}
.errbox{background:#fdecec;border:1px solid #f5b5b5;border-radius:12px;padding:9px 11px;margin:6px 0;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:#f7faf9;color:var(--ink);font-weight:500;border:1px solid var(--line)}
.opt.right{background:#eaf7ee;border-color:var(--good)}.opt.wrong{background:#fdecec;border-color:var(--bad)}
.dots{display:flex;gap:6px}.dots i{width:22px;height:22px;border-radius:50%;background:var(--line);display:inline-block}.dots i.on{background:var(--pri)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--pri)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal .sheet{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:#14211f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:60;max-width:90%}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--soft);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.ph{display:inline-block;margin:3px;padding:4px 8px;border-radius:8px;background:#f7faf9;border:1px solid var(--line);font-weight:600}
.list-item{padding:10px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}
.check{color:var(--good);font-weight:700}
details summary{cursor:pointer;font-weight:600;color:var(--pri2)}
.hr{height:1px;background:var(--line);margin:12px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:600}
</style>

const AudioK={ctx:null,cur:null,
  ensure(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();}if(this.ctx.state!=="running")this.ctx.resume();return this.ctx;},
  async playArrayBuffer(ab){const ctx=this.ensure();const buf=await ctx.decodeAudioData(ab.slice(0));return this.playBuf(buf);},
  playPCM(pcm,rate){const ctx=this.ensure();const b=ctx.createBuffer(1,pcm.length,rate);b.getChannelData(0).set(pcm);return this.playBuf(b);},
  playBuf(buf){this.stop();const ctx=this.ensure();const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
    return new Promise(res=>{src._res=res;src.onended=()=>{if(this.cur===src)this.cur=null;res();};this.cur=src;src.start();});},
  stop(){if(this.cur){const c=this.cur;this.cur=null;try{c.stop();}catch(e){}try{c._res&&c._res();}catch(e){}}try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
};
const Rec={active:false,stream:null,src:null,node:null,chunks:[],rate:48000,
  async start(){const ctx=AudioK.ensure();AudioK.stop();
    try{if(navigator.audioSession)navigator.audioSession.type="play-and-record";}catch(e){}
    this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    this.src=ctx.createMediaStreamSource(this.stream);this.node=ctx.createScriptProcessor(4096,1,1);this.chunks=[];this.rate=ctx.sampleRate;
    this.node.onaudioprocess=e=>{if(this.active)this.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));};
    this.src.connect(this.node);this.node.connect(ctx.destination);this.active=true;},
  stop(){if(!this.active&&!this.stream)return null;this.active=false;
    try{this.src.disconnect();this.node.disconnect();}catch(e){}
    try{this.stream.getTracks().forEach(t=>t.stop());}catch(e){}this.stream=null;
    try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
    let len=0;for(const c of this.chunks)len+=c.length;const all=new Float32Array(len);let o=0;for(const c of this.chunks){all.set(c,o);o+=c.length;}this.chunks=[];
    const pcm=trimSilence(downsample(all,this.rate,16000),16000);if(!pcm)return{empty:true};
    return{pcm,wav:encodeWav(pcm,16000),seconds:pcm.length/16000};}
};
function downsample(buf,inR,outR){if(inR===outR)return buf;const r=inR/outR,n=Math.floor(buf.length/r),out=new Float32Array(n);
  for(let i=0;i<n;i++){const s=Math.floor(i*r),e=Math.min(buf.length,Math.floor((i+1)*r));let sum=0;for(let j=s;j<e;j++)sum+=buf[j];out[i]=sum/Math.max(1,e-s);}return out;}
function trimSilence(pcm,rate){const F=Math.round(rate*0.02),n=Math.floor(pcm.length/F);if(n<5)return null;const rms=new Float32Array(n);let mx=0;
  for(let i=0;i<n;i++){let s=0;for(let j=i*F;j<(i+1)*F;j++)s+=pcm[j]*pcm[j];rms[i]=Math.sqrt(s/F);if(rms[i]>mx)mx=rms[i];}
  const thr=Math.max(0.004,mx*0.08);let first=-1,last=-1,cnt=0;for(let i=0;i<n;i++)if(rms[i]>thr){cnt++;if(first<0)first=i;last=i;}
  if(cnt<8||mx<0.01)return null;const a=Math.max(0,(first-15)*F),b=Math.min(pcm.length,(last+20)*F);
  let out=pcm.slice(a,b);const g=mx<0.25?Math.min(4,0.5/mx):1;if(g>1){out=out.map(x=>Math.max(-1,Math.min(1,x*g)));}return out;}
function encodeWav(pcm,rate){const b=new ArrayBuffer(44+pcm.length*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF");v.setUint32(4,36+pcm.length*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,pcm.length*2,true);
  for(let i=0;i<pcm.length;i++){const s=Math.max(-1,Math.min(1,pcm[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);}return new Blob([b],{type:"audio/wav"});}
async function blobB64(blob){const ab=await blob.arrayBuffer();const u=new Uint8Array(ab);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function micErr(e){const n=e&&e.name;if(n==="NotAllowedError")return"Bạn chưa cho phép micro. Vào Cài đặt iPhone → Safari → Micro → Cho phép.";if(n==="NotFoundError")return"Không tìm thấy micro.";return"Không mở được micro: "+(e&&e.message||e);}

/* ---------------- Azure: chấm phát âm + giọng đọc ---------------- */
const Az={
  ok(){return !!(S.settings.azureKey&&S.settings.azureRegion&&window.SpeechSDK);},
  cfg(){return SpeechSDK.SpeechConfig.fromSubscription(S.settings.azureKey.trim(),S.settings.azureRegion.trim());},
  left(){checkMonth();return Math.max(0,AZ_FREE_SEC-S.usage.azureSec);},
  async assess(wav,seconds,ref){
    if(!this.ok())throw new Error("Chưa có key Azure (vào Cài đặt).");
    if(this.left()<seconds)throw new Error("Đã hết 5 giờ chấm phát âm miễn phí của tháng này. Sang tháng sẽ có lại.");
    try{return await this._assess(wav,seconds,ref,S.settings.prosody);}
    catch(e){if(S.settings.prosody&&!/401|403|auth|key|quota|hết/i.test(e.message)){S.settings.prosody=false;save();return await this._assess(wav,seconds,ref,false);}throw e;}
  },
  _assess(wav,seconds,ref,prosody){return new Promise((resolve,reject)=>{
    const sc=this.cfg();sc.speechRecognitionLanguage="en-US";sc.outputFormat=SpeechSDK.OutputFormat.Detailed;
    const ac=SpeechSDK.AudioConfig.fromWavFileInput(new File([wav],"a.wav",{type:"audio/wav"}));
    const scripted=!!(ref&&ref.trim());
    const pa=new SpeechSDK.PronunciationAssessmentConfig(scripted?ref:"",SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,SpeechSDK.PronunciationAssessmentGranularity.Phoneme,scripted);
    pa.phonemeAlphabet="IPA";if(prosody)pa.enableProsodyAssessment=true;
    const rec=new SpeechSDK.SpeechRecognizer(sc,ac);pa.applyTo(rec);
    const segs=[];let done=false;
    const fin=(err)=>{if(done)return;done=true;clearTimeout(to);try{rec.stopContinuousRecognitionAsync(()=>rec.close(),()=>rec.close());}catch(x){}
      if(err)return reject(err);S.usage.azureSec+=seconds;save();resolve(mergeSegs(segs,scripted));};
    const to=setTimeout(()=>fin(new Error("Azure phản hồi quá lâu, thử lại nhé.")),45000);
    rec.recognized=(s,e)=>{if(e.result.reason===SpeechSDK.ResultReason.RecognizedSpeech){try{segs.push(JSON.parse(e.result.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult)));}catch(x){}}};
    rec.canceled=(s,e)=>{if(e.reason===SpeechSDK.CancellationReason.Error){const d=e.errorDetails||"";fin(new Error(/401|403|Unauthorized|authentication/i.test(d)?"Key Azure hoặc vùng (region) không đúng. Kiểm tra lại trong Cài đặt.":"Lỗi Azure: "+d));}else fin();};
    rec.sessionStopped=()=>fin();
    rec.startContinuousRecognitionAsync(()=>{},err=>fin(new Error("Lỗi Azure: "+err)));
  });}
};
function mergeSegs(segs,scripted){if(!segs.length)return{empty:true};const words=[];const parts=[];let text=[];
  for(const sg of segs){const nb=(sg.NBest||[])[0];if(!nb)continue;text.push(nb.Display||sg.DisplayText||"");const pa=nb.PronunciationAssessment||{};const ws=nb.Words||[];
    parts.push({n:Math.max(1,ws.length),acc:pa.AccuracyScore,flu:pa.FluencyScore,comp:pa.CompletenessScore,pros:pa.ProsodyScore,pron:pa.PronScore});
    for(const w of ws){const p=w.PronunciationAssessment||{};words.push({w:w.Word,acc:p.AccuracyScore==null?0:Math.round(p.AccuracyScore),err:p.ErrorType||"None",
      ph:(w.Phonemes||[]).map(x=>({p:x.Phoneme,acc:Math.round((x.PronunciationAssessment||{}).AccuracyScore||0)}))});}}
  if(!parts.length)return{empty:true};
  const wavg=k=>{let s=0,n=0;for(const p of parts)if(typeof p[k]==="number"){s+=p[k]*p.n;n+=p.n;}return n?Math.round(s/n):null;};
  return{text:text.join(" "),acc:wavg("acc"),flu:wavg("flu"),comp:scripted?wavg("comp"):null,pros:wavg("pros"),pron:wavg("pron"),words};}

const TTS={cache:new Map(),
  voices:{us_f:"en-US-AvaMultilingualNeural",us_m:"en-US-AndrewMultilingualNeural",gb_m:"en-GB-RyanNeural",gb_f:"en-GB-SoniaNeural",au_f:"en-AU-NatashaNeural",au_m:"en-AU-WilliamNeural"},
  async speak(text,voice,rate){text=String(text||"").trim();if(!text)return;voice=voice||"us_f";rate=rate==null?stageRate():rate;AudioK.ensure();AudioK.stop();
    const k=voice+"|"+rate+"|"+text;checkMonth();
    if(Az.ok()&&S.usage.ttsChars<TTS_FREE){try{let ab=this.cache.get(k);if(!ab){ab=await this.synth(text,voice,rate);this.cache.set(k,ab);}return await AudioK.playArrayBuffer(ab);}catch(e){console.warn("TTS",e);}}
    return this.browser(text,rate);},
  synth(text,voice,rate){return new Promise((res,rej)=>{const sc=Az.cfg();sc.speechSynthesisOutputFormat=SpeechSDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3;
    const syn=new SpeechSDK.SpeechSynthesizer(sc,SpeechSDK.AudioConfig.fromStreamOutput(SpeechSDK.AudioOutputStream.createPullStream()));
    const vn=this.voices[voice]||this.voices.us_f;const r=(rate>=0?"+":"")+rate+"%";
    const ssml=`<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="${vn.slice(0,5)}"><voice name="${vn}"><prosody rate="${r}">${xmlEsc(text)}</prosody></voice></speak>`;
    const to=setTimeout(()=>{try{syn.close();}catch(e){}rej(new Error("tts timeout"));},20000);
    syn.speakSsmlAsync(ssml,r2=>{clearTimeout(to);try{syn.close();}catch(e){}if(r2.reason===SpeechSDK.ResultReason.SynthesizingAudioCompleted&&r2.audioData&&r2.audioData.byteLength){S.usage.ttsChars+=text.length;save();res(r2.audioData);}else rej(new Error(r2.errorDetails||"tts"));},
      err=>{clearTimeout(to);try{syn.close();}catch(e){}rej(new Error(err));});});},
  browser(text,rate){return new Promise(res=>{if(!window.speechSynthesis)return res();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=Math.max(.6,1+rate/100);
    const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;u.onend=res;u.onerror=res;speechSynthesis.speak(u);});}
};

function nextTopic(){const st=S.profile.stage,list=TOPICS[st],i=S.profile.lessonIdx[st]||0;return{t:list[i%list.length],variation:Math.floor(i/list.length)};}

  const sys="You are an expert English teacher for Vietnamese adult learners. You design short, practical speaking lessons. Always answer with valid JSON only. All Vietnamese text must be natural Vietnamese with full diacritics.";
  const prompt=`${PROFILE}

   "speakers": [{"name":"${char}","voice":"${CHARS[char].voice}"},{"name":"another person name","voice":"one of us_f,us_m,gb_f,gb_m,au_f,au_m, different from ${CHARS[char].voice}"}],

function talkSystem(){const c=S.current,L=c.lesson,st=STAGES[L.stage];const sc=L.scenario;
  return `You are role-playing as ${L.char}: ${CHARS[L.char].desc}
You are talking with an English learner. ${PROFILE}
Stage ${L.stage} (${st.name}, ${st.level}). Language rules for YOUR replies: ${st.rules}
Scene: ${sc.setting_vi} | Learner role: ${sc.learner_role_vi} | Your role: ${sc.ai_role_vi} | Learner goal: ${sc.goal_vi}
Target phrases the learner should use (index: phrase): ${L.phrases.map((p,i)=>i+": "+p.en).join(" | ")}

Each request contains the conversation so far and the learner's newest turn (audio or typed text). Do this:
1. Transcribe exactly what the learner said (keep their mistakes; if they spoke Vietnamese, write the Vietnamese).
2. If the learner spoke mostly Vietnamese or could not say it in English: set spoke_vietnamese=true, give english_version (a simple English sentence at stage level for what they wanted to say) and leave reply empty.
3. Otherwise judge errors. major_error = at most ONE error that changes the meaning or is a very basic mistake for this stage (null if none). minor_errors = other small grammar/word-choice errors (max 3). Explanations in short, friendly Vietnamese. Ignore punctuation and capitalization. Do not flag acceptable informal speech.
4. phrases_used = indexes of target phrases the learner used correctly or almost correctly in THIS turn.
5. reply = your in-character reply (1-3 short sentences at stage level). Keep the conversation going, usually ending with a question, and naturally create chances for the learner to use target phrases not yet used. Be warm and encouraging.
6. After about 10 learner turns, or when the goal is reached, wrap up naturally and set end=true.
Return JSON only:
{"transcript":"","spoke_vietnamese":false,"english_version":"","major_error":null or {"wrong":"","right":"","explain_vi":""},"minor_errors":[{"wrong":"","right":"","explain_vi":""}],"phrases_used":[],"reply":"","reply_vi":"","suggestion_en":"a possible next answer for the learner at stage level","suggestion_vi":"","end":false}`;}
function convoText(){const c=S.current;return c.data.talk.map(t=>t.who==="ai"?`${c.lesson.char}: ${t.en}`:`Learner: ${t.text}`).join("\n");}
function startTalk(){const c=S.current;if(!c||c.data.talk.length)return;const sc=c.lesson.scenario;c.data.talk=[{who:"ai",en:sc.opening_en,vi:sc.opening_vi,sug_en:sc.first_reply_en,sug_vi:sc.first_reply_vi}];save();render();
  TTS.speak(sc.opening_en,CHARS[c.lesson.char].voice).catch(()=>{});}
async function talkTurn(out,typed){const c=S.current;const turnId="t"+uid();
  const parts=[{text:"CONVERSATION SO FAR:\n"+convoText()+"\n\n"+(typed?"The learner's newest turn (typed): "+typed:"The learner's newest turn is in the attached audio.")}];
  if(out)parts.push({inlineData:{mimeType:"audio/wav",data:await blobB64(out.wav)}});
  const jobs=[Gem.call("lite",talkSystem(),parts,0.8)];
  const doPron=out&&Az.ok()&&S.settings.convoPron&&Az.left()>AZ_RESERVE_SEC;
  jobs.push(doPron?Az.assess(out.wav,out.seconds,"").catch(e=>({err:e.message})):Promise.resolve(null));
  const [g,pr]=await Promise.all(jobs);
  if(out)R.audio[turnId]=out.pcm;
  const me={who:"me",id:turnId,text:g.transcript||(pr&&pr.text)||typed||"",vn:!!g.spoke_vietnamese,eng:g.english_version||"",major:g.major_error&&g.major_error.wrong?g.major_error:null,typed:!!typed};
  if(pr&&!pr.err&&!pr.empty){R.results[turnId]=pr;me.pron={acc:pr.acc,flu:pr.flu,pros:pr.pros,pron:pr.pron,words:pr.words.map(w=>({w:w.w,acc:w.acc,err:w.err}))};c.data.talkPron.push(me.pron);addPhon(c.data.phon,pr.words);}
  c.data.talk.push(me);

  c.data.turns++;
  if(me.major)c.data.major.push(me.major);
  for(const m of (g.minor_errors||[]))if(m&&m.wrong)c.data.minor.push(m);
  for(const i of (g.phrases_used||[]))if(!c.data.used.includes(i)&&c.lesson.phrases[i])c.data.used.push(i);
  if(g.reply){c.data.talk.push({who:"ai",en:g.reply,vi:g.reply_vi||"",sug_en:g.suggestion_en||"",sug_vi:g.suggestion_vi||""});}
  if(g.end)c.data.ended=true;save();render();

function numOrNull(x){x=Number(x);return isNaN(x)?null:Math.max(0,Math.min(100,Math.round(x)));}

/* ---------------- Tổng kết & lưu buổi ---------------- */
function sessionScores(c){const d=c.data;const dr=Object.values(d.drills).concat(d.talkPron);
  const acc=avg(dr.map(x=>x.acc)),flu=avg(dr.map(x=>x.flu)),pros=avg(dr.map(x=>x.pros)),pron=avg(dr.map(x=>x.pron));
  const mq=Object.entries(d.mcq).filter(([k])=>!k.endsWith("_pick")).map(([k,v])=>v),dq=Object.values(d.dict);const lis=avg([mq.length?100*mq.filter(x=>x).length/mq.length:null,dq.length?avg(dq):null]);
  const usedPct=c.lesson.phrases.length?100*d.used.length/c.lesson.phrases.length:null;
  const rv=d.review||{};const vocab=rv.vocab!=null?(usedPct!=null?0.7*rv.vocab+0.3*usedPct:rv.vocab):null;
  const fluency=avg([flu,pros]);
  const skills={pron:rnd(acc),fluency:rnd(fluency),grammar:rv.grammar!=null?rv.grammar:null,vocab:rnd(vocab),listen:rnd(lis)};
  return{acc:rnd(acc),flu:rnd(flu),pros:rnd(pros),pron:rnd(pron),usedPct:rnd(usedPct),skills,overall:rnd(avg(Object.values(skills)))};}
function finishSession(){const c=S.current;if(!c)return;const sc=sessionScores(c);const d=c.data;const now=new Date();

    minutes:Math.max(1,Math.round((Date.now()-d.startedAt)/60000)),scores:sc,turns:d.turns,hints:d.hints,used:d.used.length,phrasesTotal:c.lesson.phrases.length,
    corrections:(d.review&&d.review.corrections)||[],strength_vi:d.review&&d.review.strength_vi,improve_vi:d.review&&d.review.improve_vi,phon:d.phon,
    words:d.talk.filter(t=>t.who==="me"&&!t.vn).reduce((s,t)=>s+String(t.text).split(/\s+/).filter(Boolean).length,0)};

  for(const p of c.lesson.phrases){if(ex.has(p.en.toLowerCase().trim()))continue;S.phrases.push({id:uid(),en:p.en,vi:p.vi,ex:p.example_en,exvi:p.example_vi,box:0,due:addDays(today(),1),added:today(),topic:c.lesson.title_vi});}
  for(const [p,v] of Object.entries(d.phon)){const o=S.phon[p]||(S.phon[p]={sum:0,n:0});o.sum+=v.sum;o.n+=v.n;}
  for(const e of d.major.concat(d.minor))S.errors.push({wrong:e.wrong,right:e.right,explain_vi:e.explain_vi,day:today()});
  if(S.errors.length>300)S.errors=S.errors.slice(-300);
  S.profile.lessonIdx[c.lesson.stage]=(S.profile.lessonIdx[c.lesson.stage]||0)+1;
  const snd=SOUNDS.findIndex(s=>s.id===c.lesson.sound);if(snd===(S.profile.soundIdx||0)%SOUNDS.length)S.profile.soundIdx=(S.profile.soundIdx||0)+1;
  if(!S.profile.stageSince)S.profile.stageSince=rec.week;
  S.current=null;if(S.sessions.length>400)S.sessions=S.sessions.slice(-400);save();
  R.audio={};R.results={};
  const wk=rec.week,cnt=S.sessions.filter(s=>s.week===wk).length;
  if(cnt>=5&&!S.reports[wk]){R.view="bench";R.bench={};R.benchWeek=wk;}else{R.view="done";R.lastSession=rec;}
  render();window.scrollTo(0,0);autoBackup();}

/* ---------------- Báo cáo tuần ---------------- */
function weekMetrics(wk){const ss=S.sessions.filter(s=>s.week===wk);if(!ss.length)return null;const k=["pron","fluency","grammar","vocab","listen"];const sk={};
  for(const x of k)sk[x]=rnd(avg(ss.map(s=>s.scores.skills[x])));
  const ph={};for(const s of ss)for(const [p,v] of Object.entries(s.phon||{})){const o=ph[p]||(ph[p]={sum:0,n:0});o.sum+=v.sum;o.n+=v.n;}
  return{week:wk,sessions:ss.length,minutes:ss.reduce((a,s)=>a+s.minutes,0),turns:ss.reduce((a,s)=>a+s.turns,0),words:ss.reduce((a,s)=>a+(s.words||0),0),
    hints:ss.reduce((a,s)=>a+(s.hints||0),0),skills:sk,overall:rnd(avg(Object.values(sk))),weak:weakPhonemes(ph,5).map(w=>({p:w.p,avg:Math.round(w.avg)})),
    corrections:ss.flatMap(s=>s.corrections||[]).slice(-12),topics:ss.map(s=>s.title_vi),stage:ss[ss.length-1].stage};}
function allWeeks(){return [...new Set(S.sessions.map(s=>s.week))].sort();}
async function buildReport(wk,bench){const m=weekMetrics(wk);if(!m)return;const weeks=allWeeks();const prevWk=weeks.filter(w=>w<wk).pop();const prev=prevWk?(S.reports[prevWk]&&S.reports[prevWk].metrics)||weekMetrics(prevWk):null;
  const prevBench=prevWk&&S.reports[prevWk]?S.reports[prevWk].bench:null;
  const rep={week:wk,metrics:m,prev:prev?{skills:prev.skills,overall:prev.overall}:null,bench:bench==null?null:bench,prevBench,created:new Date().toISOString(),ai:null,promoted:false};
  // Lên giai đoạn
  const st=S.profile.stage;const since=S.profile.stageSince||wk;const weeksIn=weeks.filter(w=>w>=since&&w<=wk).length;
  if(st<3){const need=st===1?{w:3,o:72,b:70}:{w:6,o:75,b:75};if(weeksIn>=need.w&&(m.overall||0)>=need.o&&(bench==null||bench>=need.b)){S.profile.stage=st+1;S.profile.stageSince=addDays(wk,7);rep.promoted=st+1;}}
  rep.weeksInStage=weeksIn;S.reports[wk]=rep;save();
  try{const r=await Gem.call("flash","You are a supportive but honest English coach for a Vietnamese learner. JSON only. Vietnamese with full diacritics.",[{text:
`${PROFILE}
Weekly data (scores 0-100): ${JSON.stringify({thisWeek:m,lastWeek:rep.prev,benchmarkReadAloud:{thisWeek:bench,lastWeek:prevBench},stage:st,weeksInStage:weeksIn,promotedTo:rep.promoted||null})}
Weak phonemes are IPA symbols with average accuracy. Corrections are real mistakes from this week.
Write a weekly progress report. Return JSON:
{"status":"good" | "steady" | "slow","headline_vi":"one short sentence verdict","analysis_vi":"3-5 sentences: what improved, what did not, compared with last week if available","wins_vi":["2-3 concrete wins"],"patterns_vi":["2-3 recurring mistakes with the correct form"],"focus_vi":["3 concrete focus points for next week"],"tip_vi":"one practical daily habit tip"}`}],0.5);
    rep.ai=r;S.reports[wk]=rep;save();}catch(e){toast("Chưa viết được nhận xét AI: "+e.message,6000);}
  autoBackup();
}
function maybeBackfillReport(){const cur=weekKey();const past=allWeeks().filter(w=>w<cur&&!S.reports[w]);const last=past.pop();if(last&&!R.flags.backfill){R.flags.backfill=true;buildReport(last,null).then(render);}}

function scoreChips(r,keys){keys=keys||[["pron","Tổng"],["acc","Chính xác"],["flu","Trôi chảy"],["pros","Ngữ điệu"],["comp","Đầy đủ"]];
  return `<div class="scores">${keys.filter(([k])=>r[k]!=null).map(([k,n])=>`<div class="sc"><b class="${cls(r[k])}">${r[k]}</b><span>${n}</span></div>`).join("")}</div>`;}
function wordsHtml(rid,words){return `<div>${(words||[]).map((w,i)=>`<span class="w ${w.err==="Omission"?"o":wcls(w.acc)}" data-act="word" data-rid="${rid}" data-i="${i}">${esc(w.w)}</span>`).join(" ")}</div>`;}
function resultBlock(rid){const r=R.results[rid];const saved=S.current&&S.current.data.drills[rid];
  if(R.busy.proc===rid)return `<p class="mute"><span class="spin"></span> Đang chấm điểm...</p>`;
  if(!r&&!saved)return"";
  if(r&&r.noaz)return `<div class="row"><button class="btn-sm" data-act="playme" data-rid="${rid}">▶︎ Nghe lại giọng bạn</button></div>`;
  if(r&&r.empty)return `<p class="c-b small">Không nhận ra câu nói, thử lại nhé.</p>`;
  const x=r||saved;return `${scoreChips(x)}${wordsHtml(rid,x.words)}<p class="small mute">Chạm vào từ màu vàng/đỏ để xem lỗi từng âm.</p>${R.audio[rid]?`<button class="btn-sm" data-act="playme" data-rid="${rid}">▶︎ Nghe lại giọng bạn</button>`:""}`;}
function micBtn(ctx,ref,small){const on=R.recCtx===ctx;const dis=(Rec.active&&!on)||!!R.busy.proc;
  return `<button class="mic ${small?"sm":""} ${on?"rec":""}" data-act="rec" data-ctx="${esc(ctx)}" data-ref="${esc(ref||"")}" ${dis?"disabled":""} aria-label="Ghi âm">${on?"■":"🎙"}</button>`;}
function speakBtn(text,voice,label,rate){return `<button class="btn-sm" data-act="say" data-text="${esc(text)}" data-voice="${voice||"us_f"}" ${rate!=null?`data-rate="${rate}"`:""}>${label||"🔊 Nghe"}</button>`;}
function drillCard(rid,en,vi,extra){return `<div class="card"><div class="en">${esc(en)}</div>${vi?`<div class="vi">${esc(vi)}</div>`:""}${extra||""}

function stepListen(c){const Ls=c.lesson.listening;const d=c.data;const voiceOf=n=>{const sp=(Ls.speakers||[]).find(s=>s.name===n);return(sp&&sp.voice)||"us_m";};const show=R.flags.transcript;
  return `<h2>🎧 Luyện nghe</h2><p class="mute">${esc(Ls.intro_vi||"")}</p>
  <div class="card"><div class="row"><button class="btn-pri" data-act="playdlg" data-rate="${stageRate()}">${R.flags.playing?"⏹ Dừng":"▶︎ Nghe cả đoạn"}</button><button data-act="playdlg" data-rate="-30">🐢 Nghe chậm</button></div>
   <p class="small mute">Nghe 2 lần trước khi xem lời thoại.</p><button class="btn-ghost small" data-act="toggle" data-f="transcript">${show?"Ẩn lời thoại":"Hiện lời thoại"}</button>
   ${show?(Ls.lines||[]).map(l=>`<p><b>${esc(l.speaker)}:</b> ${esc(l.en)} ${speakBtn(l.en,voiceOf(l.speaker),"🔊")}<br><span class="vi">${esc(l.vi)}</span></p>`).join(""):""}</div>
  <h3>Câu hỏi</h3>${(Ls.questions||[]).map((q,qi)=>{const ans=d.mcq["q"+qi+"_pick"];return `<div class="card"><b>${qi+1}. ${esc(q.q_en)}</b><div class="vi">${esc(q.q_vi||"")}</div>
   ${(q.options||[]).map((o,oi)=>`<button class="opt ${ans!=null?(oi===q.answer?"right":oi===ans?"wrong":""):""}" data-act="mcq" data-q="${qi}" data-o="${oi}" ${ans!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>`;}).join("")}
  <h3>Nghe & chép lại</h3>${(Ls.dictation||[]).map((s,di)=>{const r=d.dict["d"+di];const res=R.flags["dres"+di];return `<div class="card"><div class="row">${speakBtn(s,voiceOf(((Ls.lines||[]).find(l=>l.en===s)||{}).speaker),"🔊 Nghe")}${speakBtn(s,"us_f","🐢 Chậm",-35)}</div>
   <input id="dict${di}" placeholder="Gõ lại câu bạn nghe được" style="margin-top:8px" autocapitalize="off" autocomplete="off" spellcheck="false"><div class="row" style="margin-top:8px"><button class="btn-sm" data-act="dict" data-i="${di}">Kiểm tra</button>${r!=null?`<b class="${cls(r)}">${r}%</b>`:""}</div>
   ${res?`<p>${res}</p>`:""}</div>`;}).join("")}`;}
// Ghi chú: d.mcq lưu q{i}=true/false (đúng/sai) và q{i}_pick = lựa chọn (lọc ra khi tính điểm)

function stepTalk(c){const L=c.lesson,d=c.data;const last=[...d.talk].reverse().find(t=>t.who==="ai");
  const bubbles=d.talk.map((t,i)=>{if(t.who==="ai")return `<div class="bubble ai"><b>${esc(L.char)}:</b> ${esc(t.en)} <button class="btn-sm btn-ghost" data-act="say" data-text="${esc(t.en)}" data-voice="${CHARS[L.char].voice}">🔊</button>
      ${R.flags["vi"+i]||L.stage===1?`<div class="vi">${esc(t.vi)}</div>`:`<button class="btn-ghost small" data-act="toggle" data-f="vi${i}">Dịch</button>`}</div>`;
    let h=`<div class="bubble me">${t.typed?"⌨️ ":""}${t.pron?wordsHtml(t.id,t.pron.words):esc(t.text)}${R.audio[t.id]?` <button class="btn-sm btn-ghost" data-act="playme" data-rid="${t.id}">▶︎</button>`:""}</div>`;
    if(t.pron)h+=`<div class="small mute" style="text-align:right">Phát âm <b class="${cls(t.pron.acc)}">${t.pron.acc}</b> · Trôi chảy <b class="${cls(t.pron.flu)}">${t.pron.flu}</b>${t.pron.pros!=null?` · Ngữ điệu <b class="${cls(t.pron.pros)}">${t.pron.pros}</b>`:""}</div>`;
    if(t.vn)h+=`<div class="fixbox">🇬🇧 Bạn có thể nói: <b>${esc(t.eng)}</b> ${speakBtn(t.eng,"us_f","🔊")}<br><span class="small">Thử nói lại câu này bằng tiếng Anh nhé!</span></div>`;
    if(t.major)h+=`<div class="errbox">⚠️ <s>${esc(t.major.wrong)}</s> → <b>${esc(t.major.right)}</b> ${speakBtn(t.major.right,"us_f","🔊")}<br><span class="small">${esc(t.major.explain_vi)}</span></div>`;
    return h;}).join("");
  const used=d.used;
  return `<h2>💬 Hội thoại với ${esc(L.char)}</h2>
  <details class="card"><summary>🎯 Nhiệm vụ & ${used.length}/${L.phrases.length} cụm từ đã dùng</summary><p class="small">${esc(L.scenario.setting_vi)}</p><p class="small">Bạn: ${esc(L.scenario.learner_role_vi)} · ${esc(L.char)}: ${esc(L.scenario.ai_role_vi)}</p><p class="small"><b>Mục tiêu:</b> ${esc(L.scenario.goal_vi)}</p>
   ${L.phrases.map((p,i)=>`<div class="small">${used.includes(i)?'<span class="check">✓</span>':"○"} <b>${esc(p.en)}</b> <span class="mute">${esc(p.vi)}</span></div>`).join("")}</details>
  ${bubbles}
  ${R.busy.proc==="talk"?`<p class="mute"><span class="spin"></span> ${esc(L.char)} đang nghe...</p>`:""}
  ${R.flags.hint&&last&&last.sug_en?`<div class="okbox">💡 Gợi ý: <b>${esc(last.sug_en)}</b> ${speakBtn(last.sug_en,"us_f","🔊")}<br><span class="small">${esc(last.sug_vi)}</span></div>`:""}
  ${d.ended?`<div class="okbox">🎉 Cuộc hội thoại đã kết thúc. Bấm <b>Xong</b> để xem phần sửa lỗi.</div>`:""}
  ${R.flags.typing?`<div class="card"><input id="typeIn" placeholder="Gõ câu tiếng Anh..." autocomplete="off"><div class="row" style="margin-top:8px"><button class="btn-pri btn-sm" data-act="sendtype">Gửi</button><button class="btn-sm" data-act="toggle" data-f="typing">Huỷ</button></div></div>`:""}
  <p class="small mute center">Chạm 🎙 để nói, chạm ■ khi nói xong. Không biết nói? Cứ nói tiếng Việt, app sẽ chỉ cách nói bằng tiếng Anh.</p>
  <div class="bar"><div class="in"><button class="btn-sm" data-act="hint">💡 Gợi ý</button><button class="btn-sm" data-act="toggle" data-f="typing">⌨️ Gõ</button>${micBtn("talk","",false)}<button class="btn-sm" data-act="prev">←</button><button class="btn-sm btn-pri" data-act="next">Xong →</button></div></div>`;}

function stepFix(c){const rv=c.data.review;if(R.busy.review||!rv)return `<h2>🛠 Sửa lỗi</h2><div class="card"><span class="spin"></span> Đang phân tích bài nói của bạn...</div>${!R.busy.review?`<button data-act="retryreview">Thử lại</button>`:""}`;
  return `<h2>🛠 Sửa lỗi & nói lại</h2>${rv.corrections.length?"":`<div class="okbox">Không có lỗi đáng kể. Tuyệt vời!</div>`}
  ${rv.corrections.map((x,i)=>drillCard("fx-"+i,x.corrected,"",`<p class="small"><s class="c-b">${esc(x.original)}</s></p><p class="small">💡 ${esc(x.explain_vi)}</p>`)).join("")}
  ${rv.better.length?`<h3>✨ Nói tự nhiên hơn</h3>${rv.better.map((x,i)=>drillCard("fb-"+i,x.natural,"",`<p class="small mute">Bạn nói: ${esc(x.original)}</p><p class="small">💡 ${esc(x.explain_vi)}</p>`)).join("")}`:""}`;}

function stepSummary(c){const sc=sessionScores(c);const rv=c.data.review||{};const sk=sc.skills;
  return `<h2>🏁 Tổng kết buổi học</h2><div class="card">${scoreChips({a:sk.pron,b:sk.fluency,c:sk.grammar,d:sk.vocab,e:sk.listen},[["a","Phát âm"],["b","Trôi chảy"],["c","Ngữ pháp"],["d","Từ vựng"],["e","Nghe"]])}
  <p>Tổng điểm: <b class="${cls(sc.overall)}" style="font-size:22px">${sc.overall==null?"–":sc.overall}</b></p><p class="small">Cụm từ đã dùng: ${c.data.used.length}/${c.lesson.phrases.length} · Lượt nói: ${c.data.turns}</p></div>
  ${rv.strength_vi?`<div class="okbox">👍 ${esc(rv.strength_vi)}</div>`:""}${rv.improve_vi?`<div class="fixbox">🎯 ${esc(rv.improve_vi)}</div>`:""}${rv.fluency_vi?`<p class="small mute">${esc(rv.fluency_vi)}</p>`:""}`;}

function viewDone(){const s=R.lastSession;const wk=weekKey();const n=S.sessions.filter(x=>x.week===wk).length;
  return `<div class="card center"><h1>🎉 Xong buổi học!</h1><p>Điểm buổi này: <b class="${cls(s&&s.scores.overall)}" style="font-size:26px">${s&&s.scores.overall!=null?s.scores.overall:"–"}</b></p><p>Tuần này: ${n}/5 buổi</p>
  <div class="dots" style="justify-content:center">${[0,1,2,3,4].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>
  <p class="small mute">Các cụm từ hôm nay sẽ được nhắc lại để ôn vào những ngày tới.</p><button class="btn-pri btn-big" data-act="nav" data-v="home">Về trang chủ</button></div>`;}

function viewBench(){const st=S.profile.stage;const list=BENCH[st];const done=Object.keys(R.bench||{}).length;
  return `<h2>📏 Bài kiểm tra tuần (3 phút)</h2><p class="mute">Đọc to 6 câu cố định. Tuần nào cũng là 6 câu này, để so sánh tiến bộ thật sự của bạn.</p>
  ${list.map((s,i)=>drillCard("bench-"+i,s,"")).join("")}
  <div class="bar"><div class="in"><button data-act="benchskip">Bỏ qua</button><button class="btn-pri" data-act="benchdone" ${R.busy.rep?"disabled":""}>${R.busy.rep?'<span class="spin"></span> Đang viết báo cáo':`Xem báo cáo tuần (${done}/6)`}</button></div></div>`;}

function deltaHtml(a,b){if(a==null||b==null)return"";const d=a-b;return `<span class="small ${d>0?"c-g":d<0?"c-b":"mute"}">${d>0?"▲ +":d<0?"▼ ":"= "}${d}</span>`;}
function viewReport(){const wk=R.reportWeek;const rep=S.reports[wk];if(!rep)return `<button class="btn-ghost" data-act="nav" data-v="home">← Về</button><p>Chưa có báo cáo.</p>`;
  const m=rep.metrics,p=rep.prev,ai=rep.ai;const names={pron:"Phát âm",fluency:"Trôi chảy",grammar:"Ngữ pháp",vocab:"Từ vựng",listen:"Nghe"};
  const stIcon={good:"🚀 Đang tiến bộ tốt",steady:"🙂 Ổn định",slow:"⚠️ Đang chững lại"};
  return `<div class="row"><button class="btn-ghost" data-act="nav" data-v="home">← Về</button><h2 class="grow">Báo cáo tuần</h2></div><p class="mute">Tuần ${fmtWeek(wk)} · Giai đoạn ${m.stage}</p>
  ${rep.promoted?`<div class="okbox">🎉 <b>Chúc mừng! Bạn đã lên Giai đoạn ${rep.promoted}: ${STAGES[rep.promoted].name}.</b></div>`:""}
  ${ai?`<div class="card"><h3>${stIcon[ai.status]||""}</h3><p><b>${esc(ai.headline_vi)}</b></p><p>${esc(ai.analysis_vi)}</p></div>`:`<div class="card"><p class="mute">Chưa có nhận xét AI.</p><button data-act="regen" data-w="${wk}">Viết nhận xét</button></div>`}
  <div class="card"><h3>Điểm kỹ năng</h3>${Object.keys(names).map(k=>`<div class="row between list-item"><span>${names[k]}</span><span><b class="${cls(m.skills[k])}">${m.skills[k]==null?"–":m.skills[k]}</b> ${p?deltaHtml(m.skills[k],p.skills[k]):""}</span></div>`).join("")}
   <div class="row between list-item"><b>Tổng</b><span><b class="${cls(m.overall)}">${m.overall==null?"–":m.overall}</b> ${p?deltaHtml(m.overall,p.overall):""}</span></div>
   ${rep.bench!=null?`<div class="row between list-item"><span>📏 Bài kiểm tra đọc</span><span><b class="${cls(rep.bench)}">${rep.bench}</b> ${deltaHtml(rep.bench,rep.prevBench)}</span></div>`:""}
   <p class="small mute">${m.sessions} buổi · ${m.minutes} phút · ${m.turns} lượt nói · ${m.words} từ đã nói</p></div>
  ${m.weak.length?`<div class="card"><h3>👄 Âm cần luyện nhất</h3>${m.weak.map(w=>`<span class="ph">/${esc(w.p)}/ ${esc(PHON_VI[w.p]||"")} · <span class="${cls(w.avg)}">${w.avg}</span></span>`).join("")}</div>`:""}
  ${ai?`<div class="card">${list("✅ Làm tốt",ai.wins_vi)}${list("🔁 Lỗi lặp lại",ai.patterns_vi)}${list("🎯 Tuần sau tập trung",ai.focus_vi)}${ai.tip_vi?`<p>💡 ${esc(ai.tip_vi)}</p>`:""}</div>`:""}`;}
function list(t,a){return a&&a.length?`<h3>${t}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";}

function lineChart(weeks){const keys=[["pron","#0f766e","Phát âm"],["fluency","#2563eb","Trôi chảy"],["grammar","#d97706","Ngữ pháp"],["vocab","#9333ea","Từ vựng"],["listen","#dc2626","Nghe"]];
  const W=320,H=160,P=24;if(weeks.length<2)return `<p class="small mute">Cần ít nhất 2 tuần dữ liệu để vẽ biểu đồ.</p>`;
  const x=i=>P+(W-2*P)*i/(weeks.length-1),y=v=>H-P-(H-2*P)*v/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ tiến bộ"><g stroke="#e2e7e5">${[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>`;
  s+=[0,50,100].map(v=>`<text x="2" y="${y(v)+4}" font-size="9" fill="#5d6b68">${v}</text>`).join("");
  for(const [k,col] of keys){const pts=weeks.map((m,i)=>m.skills[k]==null?null:`${x(i)},${y(m.skills[k])}`).filter(Boolean);if(pts.length>1)s+=`<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.join(" ")}"/>`;}
  s+=`</svg><div class="row small">${keys.map(([k,c,n])=>`<span><span style="color:${c}">●</span> ${n}</span>`).join("")}</div>`;return s;}
function viewProgress(){const weeks=allWeeks().slice(-10).map(w=>weekMetrics(w));const reps=Object.keys(S.reports).sort().reverse();
  const tot=S.sessions.reduce((a,s)=>a+s.minutes,0);const weak=weakPhonemes(S.phon,8);
  return `<div class="row"><button class="btn-ghost" data-act="nav" data-v="home">← Về</button><h2 class="grow">Tiến độ</h2></div>
  <div class="card"><div class="scores"><div class="sc"><b>${S.sessions.length}</b><span>buổi học</span></div><div class="sc"><b>${Math.round(tot/60*10)/10}</b><span>giờ</span></div><div class="sc"><b>${S.phrases.length}</b><span>cụm từ</span></div><div class="sc"><b>${S.profile.stage}</b><span>giai đoạn</span></div></div></div>
  <div class="card"><h3>Điểm theo tuần</h3>${lineChart(weeks)}</div>
  ${weak.length?`<div class="card"><h3>👄 Âm yếu nhất (từ trước đến nay)</h3>${weak.map(w=>`<span class="ph">/${esc(w.p)}/ ${esc(PHON_VI[w.p]||"")} · <span class="${cls(w.avg)}">${Math.round(w.avg)}</span></span>`).join("")}</div>`:""}
  <div class="card"><h3>📝 Báo cáo tuần</h3>${reps.length?reps.map(w=>`<div class="row between list-item"><span>Tuần ${fmtWeek(w)}</span><button class="btn-sm" data-act="report" data-w="${w}">Xem</button></div>`).join(""):`<p class="mute small">Chưa có. Báo cáo xuất hiện sau buổi thứ 5 của tuần.</p>`}</div>
  <div class="card"><h3>🗓 Buổi gần đây</h3>${S.sessions.slice(-8).reverse().map(s=>`<div class="list-item"><div class="row between"><b>${esc(s.title_vi)}</b><b class="${cls(s.scores.overall)}">${s.scores.overall==null?"–":s.scores.overall}</b></div><div class="small mute">${s.day} · ${s.minutes} phút · với ${esc(s.char)}</div></div>`).join("")||`<p class="mute small">Chưa có buổi nào.</p>`}</div>`;}
function viewPhrases(){const ps=[...S.phrases].reverse();return `<div class="row"><button class="btn-ghost" data-act="nav" data-v="home">← Về</button><h2 class="grow">Cụm từ đã học</h2></div>
  ${ps.length?ps.map(p=>`<div class="card"><div class="row between"><div class="en">${esc(p.en)}</div>${speakBtn(p.en,"us_f","🔊")}</div><div class="vi">${esc(p.vi)}</div>${p.ex?`<p class="small"><i>${esc(p.ex)}</i></p>`:""}<div class="small mute">Mức nhớ ${p.box||0}/6 · ôn lại ngày ${esc(p.due)}</div></div>`).join(""):`<p class="mute">Chưa có cụm từ nào.</p>`}`;}

document.addEventListener("click",async e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const a=el.dataset.act;
  if(el.tagName==="A")e.preventDefault();
  try{
  if(a==="nav"){AudioK.stop();R.view=el.dataset.v;render();window.scrollTo(0,0);}
  else if(a==="start")startLesson();
  else if(a==="skiptopic"){S.profile.lessonIdx[S.profile.stage]=(S.profile.lessonIdx[S.profile.stage]||0)+1;save();render();}
  else if(a==="discard"){if(R.flags.confirmDiscard){S.current=null;R.flags.confirmDiscard=false;save();render();}else{R.flags.confirmDiscard=true;toast("Bấm lần nữa để bỏ buổi học đang dở.");setTimeout(()=>R.flags.confirmDiscard=false,4000);}}
  else if(a==="exit"){AudioK.stop();if(Rec.active){Rec.stop();R.recCtx=null;}R.view="home";render();}
  else if(a==="next")goStep(1);else if(a==="prev")goStep(-1);
  else if(a==="finish")finishSession();
  else if(a==="rec")toggleRec(el.dataset.ctx,el.dataset.ref);
  else if(a==="say"){TTS.speak(el.dataset.text,el.dataset.voice,el.dataset.rate!=null?Number(el.dataset.rate):undefined).catch(err=>toast(err.message));}
  else if(a==="playme"){const p=R.audio[el.dataset.rid];if(p)AudioK.playPCM(p,16000);}
  else if(a==="word")wordModal(el.dataset.rid,Number(el.dataset.i));
  else if(a==="reveal"){R.flags["show_"+el.dataset.id]=true;render();}
  else if(a==="toggle"){R.flags[el.dataset.f]=!R.flags[el.dataset.f];render();if(el.dataset.f==="typing"&&R.flags.typing)setTimeout(()=>{const i=$("#typeIn");i&&i.focus();},50);}
  else if(a==="hint"){R.flags.hint=true;if(S.current)S.current.data.hints++;save();render();window.scrollTo(0,document.body.scrollHeight);}
  else if(a==="sendtype"){const v=($("#typeIn")||{}).value||"";if(!v.trim())return;R.flags.typing=false;R.busy.proc="talk";render();try{await talkTurn(null,v.trim());}catch(err){toast(err.message,6000);}R.busy.proc=null;render();window.scrollTo(0,document.body.scrollHeight);}
  else if(a==="mcq"){const c=S.current,q=Number(el.dataset.q),o=Number(el.dataset.o);const Q=c.lesson.listening.questions[q];c.data.mcq["q"+q+"_pick"]=o;c.data.mcq["q"+q]=(o===Q.answer);save();render();}
  else if(a==="dict"){const i=Number(el.dataset.i);const c=S.current;const ref=c.lesson.listening.dictation[i];const v=($("#dict"+i)||{}).value||"";const r=diffWords(ref,v);c.data.dict["d"+i]=r.score;R.flags["dres"+i]=r.html;save();render();const inp=$("#dict"+i);if(inp)inp.value=v;}
  else if(a==="playdlg")playDialogue(Number(el.dataset.rate));
  else if(a==="retryreview"){S.current.data.review=null;loadReview();}
  else if(a==="benchskip"){if(R.busy.rep)return;R.busy.rep=true;render();await buildReport(R.benchWeek,null);R.busy.rep=false;R.reportWeek=R.benchWeek;R.view="report";render();window.scrollTo(0,0);}
  else if(a==="benchdone"){if(R.busy.rep)return;const vals=Object.values(R.bench||{}).map(r=>r.pron);R.busy.rep=true;render();await buildReport(R.benchWeek,rnd(avg(vals)));R.busy.rep=false;R.reportWeek=R.benchWeek;R.view="report";render();window.scrollTo(0,0);}
  else if(a==="report"){R.reportWeek=el.dataset.w;R.view="report";render();window.scrollTo(0,0);}
  else if(a==="regen"){const wk=el.dataset.w;const r=S.reports[wk];toast("Đang viết nhận xét...");delete S.reports[wk];await buildReport(wk,r?r.bench:null);render();}
  else if(a==="savekeys"){S.settings.azureKey=$("#azKey").value.trim();S.settings.azureRegion=$("#azReg").value.trim().toLowerCase().replace(/\s+/g,"");const g=$("#gemKey").value.trim();if(g!==S.settings.geminiKey){S.settings.geminiKey=g;S.settings.liteModels=[];S.settings.flashModels=[];}save();toast("Đã lưu ✓");}
  else if(a==="testkeys")testKeys();
  else if(a==="saveopts"){S.settings.convoPron=$("#optConvo").checked;S.settings.prosody=$("#optPros").checked;const ns=Number($("#optStage").value);if(ns!==S.profile.stage){S.profile.stage=ns;S.profile.stageSince=weekKey();}save();toast("Đã lưu ✓");render();}
  else if(a==="repick"){S.settings.liteModels=[];S.settings.flashModels=[];R.blocked={};await Gem.pick(true);toast("Đã chọn: "+S.settings.liteModels.concat(S.settings.flashModels).join(", "),6000);render();}
  else if(a==="export"){const d=JSON.parse(JSON.stringify(S));d.settings.azureKey="";d.settings.geminiKey="";d.settings.ghToken="";const txt=JSON.stringify(d);
    showModal(`<h3>Sao lưu</h3><p class="small">Bấm Copy rồi dán vào app Ghi chú (Notes) để cất giữ.</p><textarea id="bk" rows="6">${esc(txt)}</textarea><div class="row" style="margin-top:8px"><button class="btn-pri" data-act="copybk">Copy</button><button data-act="close">Đóng</button></div>`);}
  else if(a==="copybk"){const t=$("#bk").value;try{await navigator.clipboard.writeText(t);toast("Đã copy ✓");}catch(err){$("#bk").select();toast("Hãy chọn tất cả và copy thủ công.");}}
  else if(a==="import"){showModal(`<h3>Khôi phục</h3><p class="small">Dán nội dung sao lưu vào đây. Dữ liệu hiện tại sẽ bị thay thế (giữ lại key).</p><textarea id="bk" rows="6"></textarea><div class="row" style="margin-top:8px"><button class="btn-pri" data-act="doimport">Khôi phục</button><button data-act="close">Đóng</button></div>`);}
  else if(a==="doimport"){try{const d=JSON.parse($("#bk").value);if(!d||!d.profile||!Array.isArray(d.sessions))throw 0;const keys={a:S.settings.azureKey,r:S.settings.azureRegion,g:S.settings.geminiKey,t:S.settings.ghToken,id:S.settings.gistId};localStorage.setItem(KEY,JSON.stringify(d));S=load();S.settings.ghToken=keys.t||"";S.settings.gistId=keys.id||"";S.settings.lastBackup="";S.settings.azureKey=keys.a;S.settings.azureRegion=keys.r||S.settings.azureRegion;S.settings.geminiKey=keys.g;save();closeModal();toast("Đã khôi phục ✓");R.view="home";render();}catch(err){toast("Dữ liệu sao lưu không hợp lệ.");}}
  else if(a==="reset"){showModal(`<h3>Xoá toàn bộ dữ liệu?</h3><p>Mọi buổi học, cụm từ, báo cáo sẽ mất. Không hoàn tác được.</p><div class="row"><button class="btn-danger" data-act="doreset">Xoá hết</button><button data-act="close">Huỷ</button></div>`);}
  else if(a==="doreset"){const k={a:S.settings.azureKey,r:S.settings.azureRegion,g:S.settings.geminiKey,t:S.settings.ghToken};S=defaults();S.settings.ghToken=k.t;S.settings.azureKey=k.a;S.settings.azureRegion=k.r;S.settings.geminiKey=k.g;save();closeModal();R.view="home";render();}
  else if(a==="bknow"){const t=$("#ghTok").value.trim();if(t!==S.settings.ghToken){S.settings.ghToken=t;S.settings.gistId="";S.settings.lastBackup="";}save();
    if(!t){toast("Hãy dán GitHub token trước.");return;}$("#bkOut").innerHTML='<span class="spin"></span> Đang sao lưu...';await autoBackup();toast(R.flags.bkErr?R.flags.bkErr:"Đã sao lưu lên GitHub ✓",5000);}
  else if(a==="cloudrestore"){const t=$("#ghTok").value.trim();if(t!==S.settings.ghToken){S.settings.ghToken=t;S.settings.gistId="";S.settings.lastBackup="";save();}if(!t){toast("Hãy dán GitHub token trước.");return;}
    showModal(`<h3>Khôi phục từ GitHub?</h3><p>Dữ liệu học trên máy này sẽ được thay bằng bản sao lưu trên GitHub (key vẫn giữ nguyên).</p><div class="row"><button class="btn-pri" data-act="docloudrestore">Khôi phục</button><button data-act="close">Huỷ</button></div>`);}
  else if(a==="docloudrestore"){closeModal();toast("Đang khôi phục...");const d=await Cloud.restore();R.flags.bkErr="";toast("Đã khôi phục "+d.sessions.length+" buổi học ✓",5000);R.view="home";render();}
  else if(a==="close")closeModal();
  }catch(err){console.error(err);toast(err.message||String(err),6000);}
});

function wordModal(rid,i){const r=R.results[rid];const saved=S.current&&S.current.data.drills[rid];const w=(r&&r.words&&r.words[i])||(saved&&saved.words[i]);if(!w)return;
  const ph=w.ph||[];const tips=ph.filter(p=>p.acc<70).map(p=>SOUNDS.find(s=>s.map.includes(p.p))).filter(Boolean);const uniq=[...new Set(tips)];
  const errVi={Mispronunciation:"Phát âm sai",Omission:"Bị bỏ sót (bạn không nói từ này)",Insertion:"Thừa từ",None:""}[w.err]||"";
  showModal(`<div class="row between"><h2>${esc(w.w)}</h2><b class="${cls(w.acc)}" style="font-size:24px">${w.acc}</b></div>${errVi?`<p class="c-b">${errVi}</p>`:""}
   ${ph.length?`<p class="small mute">Điểm từng âm (IPA):</p><div>${ph.map(p=>`<span class="ph"><span class="${cls(p.acc)}">/${esc(p.p)}/</span> ${p.acc}</span>`).join("")}</div>`:`<p class="small mute">Không có chi tiết từng âm cho từ này.</p>`}
   ${uniq.map(s=>`<div class="fixbox small"><b>${esc(s.ipa)} ${esc(s.name)}</b><br>${esc(s.tip)}</div>`).join("")}
   <div class="row" style="margin-top:10px">${speakBtn(w.w,"us_f","🔊 Nghe mẫu",-20)}<button data-act="close">Đóng</button></div>`);}

function diffWords(ref,inp){const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
  const a=norm(ref),b=norm(inp);const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Set();let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){hit.add(i);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  const score=n?Math.round(100*hit.size/n):0;
  const html="Đáp án: "+String(ref).split(/\s+/).map((w,k)=>`<span class="${hit.has(k)?"c-g":"c-b"}" style="font-weight:600">${esc(w)}</span>`).join(" ");
  return{score,html};}
async function playDialogue(rate){if(R.flags.playing){R.flags.playing=false;AudioK.stop();render();return;}
  const Ls=S.current.lesson.listening;const voiceOf=n=>{const sp=(Ls.speakers||[]).find(s=>s.name===n);return(sp&&sp.voice)||"us_m";};
  R.flags.playing=true;render();
  for(const l of Ls.lines||[]){if(!R.flags.playing||R.view!=="lesson")break;try{await TTS.speak(l.en,voiceOf(l.speaker),rate);}catch(e){}await new Promise(r=>setTimeout(r,350));}
  R.flags.playing=false;render();}
async function testKeys(){const out=$("#testOut");const azKey=$("#azKey").value.trim(),reg=$("#azReg").value.trim().toLowerCase().replace(/\s+/g,""),g=$("#gemKey").value.trim();
  S.settings.azureKey=azKey;S.settings.azureRegion=reg;if(g!==S.settings.geminiKey){S.settings.geminiKey=g;S.settings.liteModels=[];S.settings.flashModels=[];}save();
  out.innerHTML=`<span class="spin"></span> Đang kiểm tra...`;let msg="";
  try{await Gem.pick(true);msg+=`✅ Gemini OK (${esc(S.settings.liteModels.concat(S.settings.flashModels).slice(0,3).join(", "))})<br>`;}catch(e){msg+=`❌ Gemini: ${esc(e.message)}<br>`;}
  if(!window.SpeechSDK)msg+="❌ Không tải được thư viện Azure (kiểm tra mạng).";
  else try{AudioK.ensure();const ab=await TTS.synth("Hello! Your Azure key works.","us_f",0);await AudioK.playArrayBuffer(ab);msg+="✅ Azure OK (bạn vừa nghe giọng đọc)";}
  catch(e){msg+=`❌ Azure: ${esc(/401|403|auth/i.test(e.message)?"Key hoặc region sai":e.message)}`;}
  out.innerHTML=msg;}

checkMonth();render();maybeBackfillReport();
if(Cloud.ok()&&(!S.settings.lastBackup||Date.now()-new Date(S.settings.lastBackup).getTime()>12*3600e3))autoBackup();
document.addEventListener("visibilitychange",()=>{if(document.hidden&&Rec.active){Rec.stop();R.recCtx=null;render();}});
